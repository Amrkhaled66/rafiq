name: Deploy rafiq-backend

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t amrse912553/rafiq-backend:latest ./backend

      - name: Push Docker image
        run: docker push amrse912553/rafiq-backend:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Pull latest image
        run: sudo docker pull amrse912553/rafiq-backend:latest

      - name: Apply database migrations
        run: |
          sudo docker run --rm \
            --network host \
            --env-file /opt/rafiq/backend.env \
            amrse912553/rafiq-backend:latest \
            npm run db:migrate

      - name: Stop and remove old container
        run: sudo docker rm -f rafiq-backend-container || true

      - name: Run new container
        run: |
          sudo docker run -d \
            --network host \
            --name rafiq-backend-container \
            --restart unless-stopped \
            --env-file /opt/rafiq/backend.env \
            --env PORT=4002 \
            amrse912553/rafiq-backend:latest

      - name: Clean Docker system
        run: sudo docker system prune -af
